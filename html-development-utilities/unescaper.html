<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Unescaper</title>
    <script defer src="../home-link.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 88px 24px 40px;
            background-color: #f2f6f2;
            color: #17382d;
        }
        .tool-shell { width: min(1120px, 100%); margin: 0 auto; }
        .tool-heading { margin-bottom: 26px; }
        .tool-heading p { margin: 0 0 10px; color: #176c55; font: 11px "DM Mono", monospace; text-transform: uppercase; }
        h1 { margin: 0; font: 600 32px/1.2 "Space Grotesk", system-ui, sans-serif; }
        .tool-description { margin: 9px 0 0 !important; color: #596761 !important; font: 14px/1.55 system-ui, sans-serif !important; text-transform: none !important; }
        .box {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 18px;
            padding: 22px;
            border: 1px solid #d8e2da;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(23, 56, 45, .06);
        }
        .field-panel { display: flex; min-width: 0; flex-direction: column; gap: 9px; }
        .field-panel label { color: #375247; font-size: 13px; }
        .field-panel textarea {
            min-height: 320px;
            height: min(56vh, 520px);
            padding: 14px;
            border-color: #cad8ce;
            border-radius: 5px;
            background: #fbfdfb;
            color: #183c30;
            line-height: 1.55;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            width: 122px;
            min-height: 42px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-decode { background-color: #176c55; color: white; }
        .btn-decode:hover { background-color: #105640; }
        .btn-clear { background-color: #e8eee9; color: #28463a; }
        .btn-clear:hover { background-color: #dce8df; }
        @media (max-width: 760px) {
            body { padding: 78px 16px 24px; }
            h1 { font-size: 27px; }
            .box { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 15px; }
            .field-panel textarea { height: 230px; min-height: 180px; }
            .buttons { flex-direction: row; }
            .buttons button { width: auto; flex: 1; }
        }
    </style>
</head>
<body>

    <main class="tool-shell">
        <header class="tool-heading">
            <p>Text utilities</p>
            <h1>String Unescaper</h1>
            <p class="tool-description">Convert escaped text into readable, editable output.</p>
        </header>

        <div class="box">
            <div class="field-panel">
                <label for="input">Escaped Input String</label>
                <textarea id="input" placeholder="Paste your escaped text here..."></textarea>
            </div>

            <div class="buttons">
                <button class="btn-decode" onclick="manualUnescape()">Unescape</button>
                <button class="btn-clear" onclick="clearAll()">Clear</button>
            </div>

            <div class="field-panel">
                <label for="output">Unescaped Output</label>
                <textarea id="output" readonly placeholder="Output will appear here..."></textarea>
            </div>
        </div>
    </main>

    <script>
        function manualUnescape() {
            let str = document.getElementById('input').value;
            
            // Explicitly handling every standard backslash escape manually via regex
            let result = str
                .replace(/\\n/g, '\n')  // Newlines
                .replace(/\\t/g, '\t')  // Tabs
                .replace(/\\"/g, '"')   // Double quotes
                .replace(/\\'/g, "'")   // Single quotes
                .replace(/\\r/g, '\r')  // Carriage returns
                .replace(/\\b/g, '\b')  // Backspaces
                .replace(/\\f/g, '\f')  // Form feeds
                .replace(/\\\\/g, '\\'); // Literal backslashes

            document.getElementById('output').value = result;
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
        }
    </script>

</body>
</html>
